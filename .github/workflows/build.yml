name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Project
        run: |
          # Создаем структуру папок
          mkdir -p app/src/main/java/com/elizym/id
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # Перемещаем файлы, если они в корне
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/activity_main.xml || true
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/elizym/id/MainActivity.java || true
          [ -f floatingservice.java ] && mv floatingservice.java app/src/main/java/com/elizym/id/floatingservice.java || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true

          # Генерируем конфигурационные файлы Gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(android.view.dependencyResolutionManagement.RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'elizym'" > settings.gradle
          
          echo "plugins { id 'com.android.application' }" > build.gradle
          
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > app/build.gradle
          echo -e "plugins { id 'com.android.application' }\nandroid { namespace 'com.elizym.id'\ncompileSdk 34\ndefaultConfig { applicationId 'com.elizym.id'\nminSdk 26\ntargetSdk 34\nversionCode 1\nversionName '2.0' }\nbuildTypes { release { minifyEnabled false } } }" > app/build.gradle

          # Инициализируем Gradle Wrapper для сборки
          gradle wrapper --gradle-version 8.2

      - name: Compile APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: elizym-apk-file
          path: app/build/outputs/apk/debug/app-debug.apk
          
