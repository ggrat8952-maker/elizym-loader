name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/elizym/id
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Move Files
        run: |
          # Перемещаем созданные нами файлы в нужные папки для сборщика
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/elizym/id/ || true
          [ -f floatingservice.java ] && mv floatingservice.java app/src/main/java/com/elizym/id/ || true

      - name: Create Zip Archive
        run: |
          # Упаковываем все исходники интерфейса и логики в готовый ZIP-архив
          zip -r elizym_source_project.zip app/

      - name: Upload Finished Project
        uses: actions/upload-artifact@v4
        with:
          name: elizym-app-project
          path: elizym_source_project.zip
          
